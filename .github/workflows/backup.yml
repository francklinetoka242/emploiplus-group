name: Daily Supabase & Storage Backup to Google Drive

on:
  schedule:
    - cron: "0 3 * * *" # Tous les jours à 3h00 du matin
  workflow_dispatch: # Permet de lancer le backup manuellement depuis GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create backup directory
        run: mkdir -p backup_temp

      - name: 1. Dump Supabase Database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Le secret SUPABASE_DB_URL est manquant. Ajoutez l URL PostgreSQL du pooler Supabase dans GitHub Actions."
            exit 1
          fi

          docker run --rm \
            --network host \
            -e SUPABASE_DB_URL="$SUPABASE_DB_URL" \
            -v "$PWD/backup_temp:/backup" \
            postgres:17 \
            pg_dump \
            --dbname="$SUPABASE_DB_URL" \
            --format=plain \
            --no-owner \
            --no-privileges \
            --file=/backup/database.sql

      - name: 2. Download Supabase Storage Media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
            const { createClient } = require("@supabase/supabase-js");
            const fs = require("fs");
            const path = require("path");

            const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);

            async function downloadStorage() {
              const { data: buckets, error } = await supabase.storage.listBuckets();
              if (error) {
                console.error("Erreur listing buckets:", error);
                process.exit(1);
              }

              const storageDir = path.join("backup_temp", "storage");
              fs.mkdirSync(storageDir, { recursive: true });

              for (const bucket of buckets) {
                const bucketDir = path.join(storageDir, bucket.name);
                fs.mkdirSync(bucketDir, { recursive: true });

                async function listAndDownload(folderPath = "") {
                  const { data: files, error: listError } = await supabase.storage.from(bucket.name).list(folderPath);
                  if (listError) return;

                  for (const file of files) {
                    const fullPath = folderPath ? `${folderPath}/${file.name}` : file.name;
                    if (file.id === null) {
                      await listAndDownload(fullPath);
                    } else {
                      const { data: fileData, error: downloadError } = await supabase.storage.from(bucket.name).download(fullPath);
                      if (!downloadError && fileData) {
                        const localFilePath = path.join(bucketDir, fullPath);
                        fs.mkdirSync(path.dirname(localFilePath), { recursive: true });
                        const buffer = Buffer.from(await fileData.arrayBuffer());
                        fs.writeFileSync(localFilePath, buffer);
                      }
                    }
                  }
                }
                await listAndDownload();
              }
              console.log("Storage téléchargé avec succès.");
            }
            downloadStorage();
          '

      - name: 3. Compress Backup into a ZIP file
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          cd backup_temp
          zip -r ../supabase-full-backup-$TIMESTAMP.zip .
          echo "BACKUP_NAME=supabase-full-backup-$TIMESTAMP.zip" >> $GITHUB_ENV

      - name: 4. Upload to Google Drive via Node.js
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          BACKUP_FILE: ${{ env.BACKUP_NAME }}
        run: |
          node -e '
            const { google } = require("googleapis");
            const fs = require("fs");

            async function uploadFile() {
              const credentials = JSON.parse(process.env.GOOGLE_CREDENTIALS_JSON);
              const auth = new google.auth.GoogleAuth({
                credentials,
                scopes: ["https://www.googleapis.com/auth/drive.file"],
              });

              const drive = google.drive({ version: "v3", auth });
              const filePath = process.env.BACKUP_FILE;

              const fileMetadata = {
                name: filePath,
                parents: [process.env.GDRIVE_FOLDER_ID],
              };
              const media = {
                mimeType: "application/zip",
                body: fs.createReadStream(filePath),
              };

              const response = await drive.files.create({
                resource: fileMetadata,
                media: media,
                fields: "id",
              });
              console.log("Fichier uploadé sur Google Drive avec succès, ID:", response.data.id);
            }

            uploadFile().catch(err => {
              console.error("Erreur lors de l upload Google Drive:", err);
              process.exit(1);
            });
          '
